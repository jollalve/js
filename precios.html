    <link rel="stylesheet" href="./css/main.css">

    <link rel="shortcut icon" href="../images/logo100px.png" type="image/x-icon">
    <title>JP TATTOO</title>
</head>

<body>
    <div class="wrapper">
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <img src="../images/logo100px.png" alt="JP Tattoo Logo" href="../js/index.html">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html" data-section="header" data-value="inicio">INICIO</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../galeria.html" data-section="header" data-value="galeria">GALERIA</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../precios.html" data-section="header" data-value="precios">PRECIOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../about.html" data-section="header" data-value="sobre-mi">SOBRE MI</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../contacto.html" data-section="header" data-value="contacto">CONTACTO</a>
                        </li>

                        <div class="languages">
                            <button class="lang-button" data-language="es">ES</button>
                            <button class="lang-button" data-language="en">EN</button>
                        </div>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container-fluid">
            <div class="content-section">
                <h1 class="content-title" data-section="calculador-costos" data-value="titulo-calculador">CALCULA EL COSTO DE TU TATUAJE</h1>

                <form class="form-edad" id="formEdad">
                    <label for="fechaNacimiento" data-section="calculador-costos" data-value="fecha-nacimiento">Fecha de Nacimiento (DD-MM-AAAA): </label> 
                    <input type="date" id="fechaNacimiento" required>
                    <button type="submit" class="button-fecha"  data-section="calculador-costos" data-value="boton-verificar">Verificar Edad</button>
                    <div id="mensajeEdad"></div>
                </form>

                <form class="tattoo-form" id="tattooForm">

                    <div class="tattoo-options">
                        <label for="categoria" data-section="calculador-costos" data-value="label-categoria">Categoría: </label><select id="categoria"></select>

                        <label for="tamano" data-section="calculador-costos" data-value="label-tamano">Tamaño: </label><select id="tamano"></select>

                        <label for="color" data-section="calculador-costos" data-value="label-color">Color: </label><select id="color"></select>

                        <label for="lugar" data-section="calculador-costos" data-value="label-lugar">Lugar: </label><select id="lugar"></select>
                    </div>
                    <button class="button" type="button" onclick="calculateCost()" data-section="calculador-costos" data-value="boton-calcular">Calcular Costo</button>
                </form>
                    <h3 id="totalSection"> TOTAL: <span class="totalCost" id="totalCost">0</span><br>
                    <button id="reservarBtn" onclick="mostrarModalReserva()" style="display: none;" class="button-reservar" data-section="calculador-costos" data-value="boton-reservar">
                        Reservar Cita
                    </button>
            </div>
        </main>

        <footer class="footer bg-light text-dark py-4">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col-md-6 text-center text-md-start">
                        <ul class="footer-social-media list-inline mb-0">
                            <li class="footer-social-media-item list-inline-item">
                                <a href="https://www.instagram.com/juanptattoo/" target="_blank">
                                    <img src="../images/igicon.png" alt="Instagram" class="footer-icon footer-icon--ig">
                                </a>
                            </li>
                            <li class="footer-social-media-item list-inline-item">
                                <a href="https://web.facebook.com/Juanxnk" target="_blank">
                                    <img src="../images/fbicon.png" alt="Facebook" class="footer-icon footer-icon--fb">
                                </a>
                            </li>
                        </ul>
                    </div>
                    <div class="col-md-6 text-center text-md-end mt-3 mt-md-0 footer-copyright">
                        <p class="mb-0" data-section="footer" data-value="footer-copyright">&copy; 2024 JP TATTOO. Todos los derechos reservados.</p>
                    </div>
                </div>
            </div>
        </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/scripts.js"></script>
    <script src="./js/languages.js" defer></script>
</body>

</html>
